services:
  ecodeploy:
    build: .
    image: ecodeploy:local
    container_name: ecodeploy-web
    environment:
      PORT: "3000"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecodeploy.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ecodeploy-admin-change-me}
    ports:
      - "3000:3000"
    volumes:
      - ecodeploy-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  ecodeploy-data:
