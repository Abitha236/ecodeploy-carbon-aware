---
- name: Configure a web host and manage the EcoDeploy Docker container
  hosts: web
  become: true
  vars:
    app_image: "{{ ecodeploy_image }}"
    app_name: ecodeploy-web
    app_port: "{{ ecodeploy_port | default(3000) }}"
  tasks:
    - name: Require the published EcoDeploy application image
      ansible.builtin.assert:
        that:
          - ecodeploy_image is defined
          - ecodeploy_image | length > 0
        fail_msg: "Pass -e ecodeploy_image=registry.example/ecodeploy:tag after publishing the Docker image."
    - name: Install and start a web server on Ubuntu or Debian
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_facts.os_family == 'Debian'
    - name: Install and start a web server on RedHat family
      ansible.builtin.package:
        name: nginx
        state: present
      when: ansible_facts.os_family == 'RedHat'
    - name: Enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
    - name: Install Docker Engine package on Ubuntu or Debian
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
      when: ansible_facts.os_family == 'Debian'
    - name: Enable Docker Engine
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Pull application image
      community.docker.docker_image:
        name: "{{ app_image }}"
        source: pull
    - name: Run or update EcoDeploy container
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ app_image }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ app_port }}:3000"
        env:
          PORT: "3000"
        healthcheck:
          test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
          interval: 30s
          timeout: 3s
          retries: 3
    - name: Configure nginx reverse proxy for EcoDeploy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/ecodeploy
        mode: "0644"
        content: |
          server {
            listen 80 default_server;
            server_name _;
            location / {
              proxy_pass http://127.0.0.1:{{ app_port }};
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
          }
      when: ansible_facts.os_family == 'Debian'
      notify: Validate and reload nginx
    - name: Disable the default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      when: ansible_facts.os_family == 'Debian'
      notify: Validate and reload nginx
    - name: Enable the EcoDeploy nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/ecodeploy
        dest: /etc/nginx/sites-enabled/ecodeploy
        state: link
      when: ansible_facts.os_family == 'Debian'
      notify: Validate and reload nginx
  handlers:
    - name: Validate and reload nginx
      ansible.builtin.command: nginx -t
      changed_when: false
      notify: Reload nginx
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
